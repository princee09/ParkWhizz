version: '3.8'

services:
  # MongoDB (optional - for local development)
  mongodb:
    image: mongo:7.0
    container_name: parkwhizz-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: Parkwhizz
    volumes:
      - mongodb_data:/data/db
    networks:
      - parkwhizz-network

  # Backend (Spring Boot)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parkwhizz-backend
    ports:
      - "9090:9090"
    environment:
      # MongoDB
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin123@mongodb:27017/Parkwhizz?authSource=admin
      
      # Email (use your values)
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-devSecretKeyChangeInProduction}
      
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      
      # CORS
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      
      # Logging
      LOG_LEVEL: DEBUG
    depends_on:
      - mongodb
    networks:
      - parkwhizz-network
    restart: unless-stopped

  # Frontend (React/Vite)
  frontend:
    image: node:20-alpine
    container_name: parkwhizz-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:9090
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend
    networks:
      - parkwhizz-network

networks:
  parkwhizz-network:
    driver: bridge

volumes:
  mongodb_data:

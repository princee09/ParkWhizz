# Test Configuration - Uses embedded/mock values
server.port=0

# Mock MongoDB (won't actually connect in simple context load, but needs valid URI format)
spring.data.mongodb.uri=mongodb://localhost:27017/test

# Mock Email
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Mock JWT
jwt.secret=testSecretKeyForIntegrationTestingOnly1234567890
jwt.expiration=3600000

# Mock OAuth
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:3000

# Mock CORS
cors.allowed.origins=http://localhost:3000

# Logging
logging.level.root=INFO
